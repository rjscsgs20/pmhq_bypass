name: Build and publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        uses: actions/github-script@v9
        with:
          script: |
            const hit = (await github.paginate(github.rest.repos.listTags, context.repo))
              .filter(t => t.commit.sha === context.sha);
            if (hit.length !== 1) {
              core.setFailed(`expected 1 tag on this commit, found ${hit.length}`);
              return;
            }
            core.setOutput('name', hit[0].name);

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: pmhq-bypass
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          make_latest: true
          overwrite_files: true
          files: dist/pmhq_bypass.so
